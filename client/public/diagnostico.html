<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnóstico — Maison Rosas</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #08080e;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 720px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 span { font-size: 14px; font-weight: 400; color: #71717a; }
    .subtitle {
      color: #71717a;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .overall {
      padding: 20px 24px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid;
    }
    .overall.ok {
      background: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.25);
      color: #4ade80;
    }
    .overall.warn {
      background: rgba(250, 204, 21, 0.1);
      border-color: rgba(250, 204, 21, 0.25);
      color: #facc15;
    }
    .overall.err {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.25);
      color: #f87171;
    }
    .section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #52525b;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    @media (max-width: 500px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
    }
    .card-label {
      color: #71717a;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }
    .card-value {
      font-weight: 500;
      font-size: 13px;
      word-break: break-all;
    }
    .card-value.ok { color: #4ade80; }
    .card-value.warn { color: #facc15; }
    .card-value.err { color: #f87171; }
    .card-value.info { color: #60a5fa; }
    .loading {
      text-align: center;
      padding: 60px 0;
      color: #71717a;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid rgba(255,255,255,0.06);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: #f87171;
    }
    .db-error {
      color: #f87171;
      font-size: 11px;
      margin-top: 6px;
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #52525b;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Diagnóstico <span>Maison Rosas</span></h1>
    <p class="subtitle" id="check-time">Verificando...</p>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Ejecutando diagnósticos...</p>
    </div>

    <div id="content" style="display:none"></div>
    <div id="error" style="display:none"></div>
    <div class="footer" id="footer" style="display:none"></div>
  </div>

  <script>
    async function loadDiagnostico() {
      const loading = document.getElementById('loading');
      const content = document.getElementById('content');
      const errorDiv = document.getElementById('error');
      const footer = document.getElementById('footer');

      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        const data = await res.json();

        loading.style.display = 'none';
        content.style.display = 'block';
        footer.style.display = 'block';
        document.getElementById('check-time').textContent = 'Última verificación: ' + new Date().toLocaleString('es-PE');

        // Overall status
        const overallOk = data.overall === '✅ TODO FUNCIONANDO';
        content.innerHTML = `
          <div class="overall ${overallOk ? 'ok' : 'warn'}">
            ${data.overall}
          </div>

          <div class="section">
            <div class="section-title">🖥️ Servidor</div>
            <div class="grid-2">
              <div class="card">
                <div class="card-label">Node</div>
                <div class="card-value">${data.server.node || '-'}</div>
              </div>
              <div class="card">
                <div class="card-label">Plataforma</div>
                <div class="card-value">${data.server.platform || '-'}</div>
              </div>
              <div class="card">
                <div class="card-label">Entorno</div>
                <div class="card-value">${data.server.environment || '-'}</div>
              </div>
              <div class="card">
                <div class="card-label">Vercel</div>
                <div class="card-value">${data.server.vercel || '-'}</div>
              </div>
              <div class="card">
                <div class="card-label">Actividad</div>
                <div class="card-value info">${Math.floor(data.server.uptime || 0)}s activo</div>
              </div>
              <div class="card">
                <div class="card-label">Hora</div>
                <div class="card-value" style="font-size:11px">${new Date(data.server.time).toLocaleString('es-PE')}</div>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-title">🔐 Variables de Entorno</div>
            <div class="grid-3">
              ${Object.entries(data.env || {}).map(([key, val]) => {
                const isOk = val === '✅ configurado';
                const isOpt = val === '⚪ opcional';
                return `<div class="card">
                  <div class="card-label">${key}</div>
                  <div class="card-value ${isOk ? 'ok' : isOpt ? 'warn' : 'err'}">${val}</div>
                </div>`;
              }).join('')}
            </div>
          </div>

          <div class="section">
            <div class="section-title">🗄️ Base de Datos</div>
            <div class="card" style="margin-bottom:10px">
              <div class="card-label">Conexión</div>
              <div class="card-value ${data.database.connected ? 'ok' : 'err'}">
                ${data.database.connected ? '✅ Conectada' : '❌ Desconectada'}
              </div>
              ${data.database.error ? `<div class="db-error">${data.database.error}</div>` : ''}
            </div>
            ${data.database.tables && Object.keys(data.database.tables).length > 0 ? `
            <div class="section-title" style="margin-top:12px;font-size:10px">📊 Registros por tabla</div>
            <div class="grid-3">
              ${Object.entries(data.database.tables).map(([table, count]) => {
                const isOk = typeof count === 'number';
                return `<div class="card">
                  <div class="card-label">${table}</div>
                  <div class="card-value ${isOk ? 'ok' : 'err'}">${isOk ? count + ' registros' : count}</div>
                </div>`;
              }).join('')}
            </div>` : ''}
          </div>

          ${data.auth ? `
          <div class="section">
            <div class="section-title">👑 Autenticación Admin</div>
            <div class="card" style="margin-bottom:10px">
              <div class="card-label">Estado general</div>
              <div class="card-value ${data.auth.summary?.startsWith('✅') ? 'ok' : 'warn'}">
                ${data.auth.summary || '⚠️ Sin verificar'}
              </div>
              ${data.auth.error ? `<div class="db-error">${data.auth.error}</div>` : ''}
            </div>
            <div class="grid-3">
              ${Object.entries(data.auth.roles || {}).map(([role, info]) => {
                const r = info;
                const isOk = r.status?.startsWith('✅');
                const isWarn = r.status?.startsWith('⚠️');
                return `<div class="card">
                  <div class="card-label">${role}</div>
                  <div class="card-value ${isOk ? 'ok' : isWarn ? 'warn' : 'err'}">${r.status || '❌ error'}</div>
                  <div style="font-size:10px;color:#52525b;margin-top:2px">
                    ${r.passwordSet ? '🔑 configurada' : '⚪ sin configurar'}
                    ${r.hashPresent ? '· 💾 hash en BD' : ''}
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>
          ` : ''}
        `;
      } catch (err) {
        loading.style.display = 'none';
        errorDiv.style.display = 'block';
        document.getElementById('check-time').textContent = 'Error al verificar';
        errorDiv.innerHTML = `
          <div class="error-box">
            <div style="font-size:28px;margin-bottom:8px">⚠️</div>
            <div style="font-weight:600;margin-bottom:4px">Error de conexión</div>
            <div style="font-size:13px;color:#a1a1aa">${err.message || 'No se pudo conectar con el servidor'}</div>
            <div style="margin-top:12px;font-size:12px;color:#71717a">
              La API no está respondiendo. Verifica que las variables de entorno estén configuradas en Vercel.
            </div>
          </div>
        `;
      }
    }

    loadDiagnostico();
  </script>
</body>
</html>
